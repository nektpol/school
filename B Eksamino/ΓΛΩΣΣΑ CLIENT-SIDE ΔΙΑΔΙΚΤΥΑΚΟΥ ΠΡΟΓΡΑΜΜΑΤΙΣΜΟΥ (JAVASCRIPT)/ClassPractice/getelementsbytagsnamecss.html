<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Javascript HTML DOM</h2>
    <p>Finding HTML Elements by Tags name using getElementsByTagName() method</p>
    <p class="intro">Hello world</p>
    <p class="intro">This example demonstrates the <b>getElementsByTagName()</b> method.</p>

    <p id="demo"></p>
    <script>
        const x=document.getElementsByTagName("p");
        for(let i=0; i<x.length; i++){
            x[i].style.cssText="color:maroon; padding:6px; width:400px; border:1px solid maroon;";
        }
    </script>
</body>
</html>
