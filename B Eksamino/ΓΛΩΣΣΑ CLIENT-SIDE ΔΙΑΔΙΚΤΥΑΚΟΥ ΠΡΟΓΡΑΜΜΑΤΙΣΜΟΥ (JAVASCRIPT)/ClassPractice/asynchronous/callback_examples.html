<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        const printArray = (myCallback) =>{
            setTimeout(() => {
                const skills = ['HTML', 'CSS', 'JS'];
                myCallback(skills, 'it didnt go well');
            },2000);
        }

        const display = (result, error) => {
            if (result){
                return document.getElementById('demo').innerHTML = result;
            } else {
                return document.getElementById('demo').innerHTML = error;
            }
        }
        
        printArray(display);
    </script>
</body>
</html>
